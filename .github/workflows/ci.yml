name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Type check + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: mongodb://placeholder:placeholder@localhost:27017/placeholder
        run: npx prisma generate

      - name: Type check
        env:
          DATABASE_URL: mongodb://placeholder:placeholder@localhost:27017/placeholder
        run: npm run typecheck

      - name: Lint
        run: npm run lint
